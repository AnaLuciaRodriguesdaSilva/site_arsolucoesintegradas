<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="../css/style.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>
  <body>
<!-- Inicio do Menu Superior-------------------------------------- -->
  <nav class="navbar navbar-expand-lg menu-superior">
    <div class="container-fluid d-flex justify-content-between align-items-center">

      <!-- Seta voltar -->
      <a href="index.html" class="btn btn-voltar">
        <i class="bi bi-arrow-left"></i>
      </a>

      <!-- Campo pesquisa -->
      <form class="d-flex search-box">
        <input class="form-control rounded-pill" type="search" placeholder="Buscar produtos...">
        <button class="btn"><i class="bi bi-search"></i></button>
      </form>

      <!-- Ícones -->
      <div class="d-flex">
        <a href="#" class="icon-link"><i class="bi bi-chat-dots"></i></a>
        <a href="#" class="icon-link"><i class="bi bi-person-circle"></i></a>
        <a href="#" class="icon-link"><i class="bi bi-cart"></i></a>
      </div>
    </div>
  </nav>
  <!-- Fim do Menu Superior---------------------------------------- -->

  <!-- Inicio do Conteúdo-------------------------------------- -->
  <div class="container my-5">

    <h2 class="text-center mb-5">Produtos</h2>

    <!-- Categoria Jardinagem -->
    <h3 class="mb-4">Jardinagem e Paisagismo</h3>
    <div class="row g-4">
      <!-- Card Produto -->
      <div class="col-md-4">
        <div class="card produto-card h-100">
          <img src="../IMG/IMG Passadeira Bicolor 1.png" class="card-img-top" alt="Projeto Paisagístico">
          <div class="card-body">
            <h5 class="card-title">Projeto Paisagístico</h5>
            <p class="card-text">R$ 780,00 <br> Em até 12x R$ 75,00</p>
            <div class="stars mb-2">
              <i class="bi bi-star-fill text-warning"></i>
              <i class="bi bi-star-fill text-warning"></i>
              <i class="bi bi-star-fill text-warning"></i>
              <i class="bi bi-star text-warning"></i>
              <i class="bi bi-star text-warning"></i>
            </div>
            <div class="d-flex justify-content-between">
              <button class="btn btn-light"><i class="bi bi-heart"></i></button>
              <button class="btn btn-light"><i class="bi bi-share"></i></button>
              <button class="btn btn-add">Adicionar ao Carrinho</button>
            </div>
          </div>
        </div>
      </div>
      <!-- Repita para outros produtos -->
    </div>

    <!-- Categoria Decoração -->
    <h3 class="my-5">Decoração</h3>
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card produto-card h-100">
          <img src="../IMG/IMG Utencilios 1.png" class="card-img-top" alt="Mesa Rústica">
          <div class="card-body">
            <h5 class="card-title">Mesa Rústica com Bancos</h5>
            <p class="card-text">R$ 4.500,00 <br> Em até 12x R$ 375,00</p>
            <div class="stars mb-2">
              <i class="bi bi-star-fill text-warning"></i>
              <i class="bi bi-star-fill text-warning"></i>
              <i class="bi bi-star-fill text-warning"></i>
              <i class="bi bi-star-half text-warning"></i>
              <i class="bi bi-star text-warning"></i>
            </div>
            <div class="d-flex justify-content-between">
              <button class="btn btn-light"><i class="bi bi-heart"></i></button>
              <button class="btn btn-light"><i class="bi bi-share"></i></button>
              <button class="btn btn-add">Adicionar ao Carrinho</button>
            </div>
          </div>
        </div>
      </div>
      <!-- Repita -->
    </div>

    <!-- Categoria Utensílios -->
    <h3 class="my-5">Utensílios</h3>
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card produto-card h-100">
          <img src="../IMG/logoarsolucoes.png" class="card-img-top" alt="Conjunto de Tapetes">
          <div class="card-body">
            <h5 class="card-title">Cuscuzeira de Alumínio</h5>
            <p class="card-text">R$ 162,00 <br> Divide em até 6x R$ 27,00</p>
            <div class="stars mb-2">
              <i class="bi bi-star-fill text-warning"></i>
              <i class="bi bi-star-fill text-warning"></i>
              <i class="bi bi-star text-warning"></i>
              <i class="bi bi-star text-warning"></i>
              <i class="bi bi-star text-warning"></i>
            </div>
            <div class="d-flex justify-content-between">
              <button class="btn btn-light"><i class="bi bi-heart"></i></button>
              <button class="btn btn-light"><i class="bi bi-share"></i></button>
              <button class="btn btn-add">Adicionar ao Carrinho</button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
  <!-- Fim do Conteúdo---------------------------------------- -->

  <!-- Inicio do Rodapé-------------------------------------- -->
  <footer class="rodape text-center p-4">
    <p>Produzido por: Ana Lúcia Rodrigues da Silva</p>
    <div class="social-icons">
      <a href="#"><i class="bi bi-instagram"></i></a>
      <a href="#"><i class="bi bi-whatsapp"></i></a>
    </div>
  </footer>
  <!-- Fim do Rodapé---------------------------------------- -->


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

  </body>
</html>
