<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   <link rel="stylesheet" href="../css/style.css" />

</head>

  <body>
    
<!-- Inicio da Tela de Login-------------------------------------- -->
    <div class="container-fluid">
      <div class="row vh-100">
        
        <!-- Coluna Esquerda (Formulário) -->
        <div class="col-12 col-md-7 d-flex align-items-center justify-content-center bg-white">
          <div class="w-75 p-4 rounded shadow-sm" style="background-color: #B5C7A7;">
            <h3 class="text-center mb-4">Login</h3>
            <form>
              <div class="mb-3">
                <label for="cpf" class="form-label">CPF:</label>
                <input type="text" class="form-control rounded-pill" id="cpf" placeholder="Digite seu CPF">
              </div>
              <div class="mb-3">
                <label for="senha" class="form-label">Senha:</label>
                <input type="password" class="form-control rounded-pill" id="senha" placeholder="Digite sua senha">
              </div>
              <div class="text-center">
  <button type="submit" class="btn btn-login rounded-pill text-white">Entrar</button>
</div>


              <div class="d-flex justify-content-between mt-3">
                <a href="#">Esqueci a Senha</a>
                <a href="#">Cadastre-se</a>
              </div>
            </form>
          </div>
        </div>

        <!-- Coluna Direita (Logo) -->
        <div class="col-12 col-md-5 d-flex align-items-center justify-content-center" style="background-color: #3E5622;">
          <img src="../IMG/logoarsolucoes.png" alt="Logo da Loja" class="img-fluid" style="max-width: 60%; border-radius: 50%;">
        </div>
      </div>
    </div>
    <!-- Fim da Tela de Login---------------------------------------- -->





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>

</html>
